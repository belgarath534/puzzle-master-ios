workflows:
  puzzle-master-ios:
    name: Puzzle Master iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Build unsigned .app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData/Build/Products" -maxdepth 2 -name "*.app" | head -1)
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r App.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  puzzle-master-appstore:
    name: Puzzle Master App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      ios_signing:
        # Codemagic fetches (or creates) the App Store profile for this bundle
        # ID from Apple with the key above, and signs with the team's
        # distribution certificate saved in Codemagic.
        distribution_type: app_store
        bundle_identifier: com.puzzle.master
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Use the App Store signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers get every build; true asks for external beta review.
        submit_to_testflight: false

  register-app-id:
    # One-off: registers com.puzzle.master with Apple (App ID with Game
    # Center) through the App Store Connect key. Safe to run again.
    name: Register Puzzle Master App ID
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    scripts:
      - name: Register the App ID with Apple
        script: |
          set -e
          ID=com.puzzle.master
          FOUND=$(app-store-connect bundle-ids list --bundle-id-identifier "$ID" --strict-match-identifier --platform IOS --json)
          RID=$(echo "$FOUND" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'] if d else '')")
          if [ -z "$RID" ]; then
            echo "Creating App ID $ID"
            CREATED=$(app-store-connect bundle-ids create "$ID" --name "Puzzle Master" --platform IOS --json)
            RID=$(echo "$CREATED" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          else
            echo "App ID $ID is already registered ($RID)"
          fi
          app-store-connect bundle-ids enable-capabilities "$RID" --capability "Game Center"
          echo "Capabilities now:"
          app-store-connect bundle-ids capabilities "$RID" || true
